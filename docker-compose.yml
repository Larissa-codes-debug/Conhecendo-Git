services:

  app:
    build: .
    container_name: desafio-node
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MONGO_URL: mongodb://mongo:27017

    depends_on:
      - mongo

    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    container_name: desafio-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: